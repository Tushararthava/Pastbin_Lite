<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastebin-Lite - Create & Share Text</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      resize: vertical;
      transition: border-color 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .options-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .option-group {
      flex: 1;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }

    .result.success {
      display: block;
      border-left: 4px solid #28a745;
    }

    .result.error {
      display: block;
      border-left: 4px solid #dc3545;
    }

    .result h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .paste-url {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .paste-url input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: monospace;
    }

    .btn-copy {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-copy:hover {
      background: #5568d3;
    }

    .error-message {
      color: #dc3545;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Pastebin-Lite</h1>
    <p class="subtitle">Create and share text snippets instantly</p>

    <form id="pasteForm">
      <div class="form-group">
        <label for="content">Paste Content *</label>
        <textarea 
          id="content" 
          name="content" 
          placeholder="Enter your text here..." 
          required
        ></textarea>
      </div>

      <div class="options-row">
        <div class="option-group">
          <label for="ttl_seconds">Time to Live (seconds)</label>
          <input 
            type="number" 
            id="ttl_seconds" 
            name="ttl_seconds" 
            min="1" 
            placeholder="Optional"
          >
          <p class="hint">Leave empty for no expiry</p>
        </div>

        <div class="option-group">
          <label for="max_views">Max Views</label>
          <input 
            type="number" 
            id="max_views" 
            name="max_views" 
            min="1" 
            placeholder="Optional"
          >
          <p class="hint">Leave empty for unlimited views</p>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Create Paste
      </button>
    </form>

    <div id="result" class="result">
      <h3 id="resultTitle"></h3>
      <p id="resultMessage"></p>
      <div class="paste-url" id="pasteUrlContainer" style="display: none;">
        <input type="text" id="pasteUrl" readonly>
        <button type="button" class="btn-copy" onclick="copyUrl()">Copy</button>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('pasteForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultDiv = document.getElementById('result');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');
    const pasteUrlContainer = document.getElementById('pasteUrlContainer');
    const pasteUrlInput = document.getElementById('pasteUrl');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const content = document.getElementById('content').value.trim();
      const ttl_seconds = document.getElementById('ttl_seconds').value;
      const max_views = document.getElementById('max_views').value;

      if (!content) {
        showError('Please enter some content');
        return;
      }

      const data = { content };
      if (ttl_seconds) data.ttl_seconds = parseInt(ttl_seconds);
      if (max_views) data.max_views = parseInt(max_views);

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating...';

      try {
        const response = await fetch('/api/pastes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();

        if (response.ok && result.success) {
          showSuccess(result.data.url);
          form.reset();
        } else {
          showError(result.message || 'Failed to create paste');
        }
      } catch (error) {
        showError('Network error: ' + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Paste';
      }
    });

    function showSuccess(url) {
      resultDiv.className = 'result success';
      resultTitle.textContent = '✅ Paste Created Successfully!';
      resultMessage.textContent = 'Your paste is ready to share:';
      pasteUrlInput.value = url;
      pasteUrlContainer.style.display = 'flex';
    }

    function showError(message) {
      resultDiv.className = 'result error';
      resultTitle.textContent = '❌ Error';
      resultMessage.innerHTML = `<span class="error-message">${message}</span>`;
      pasteUrlContainer.style.display = 'none';
    }

    function copyUrl() {
      pasteUrlInput.select();
      document.execCommand('copy');
      alert('URL copied to clipboard!');
    }
  </script>
</body>
</html>
