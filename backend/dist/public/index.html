<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pastebin Lite - Share code snippets and text easily">
    <title>Pastebin Lite</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/" class="logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="icon">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                    </svg>
                    Pastebin Lite
                </a>
                <ul class="nav-links">

                </ul>
            </nav>
        </div>
    </header>


    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Simple Text & Code Sharing</h1>
            <p class="hero-subtitle">
                Minimalist pastebin for developers. No clutter, just code.
            </p>
        </div>
    </section>


    <section class="section">
        <div class="container">
            <div class="paste-form card">
                <form id="pasteForm">
                    <div class="form-group">
                        <label for="title" class="form-label">Title (Optional)</label>
                        <input type="text" id="title" name="title" class="form-input" placeholder="Enter a title..."
                            maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="content" class="form-label">Content</label>
                        <textarea id="content" name="content" class="form-textarea"
                            placeholder="Paste your content here..." required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="language" class="form-label">Language</label>
                            <select id="language" name="language" class="form-select">
                                <option value="plaintext">Plain Text</option>
                                <option value="javascript">JavaScript</option>
                                <option value="typescript">TypeScript</option>
                                <option value="python">Python</option>
                                <option value="java">Java</option>
                                <option value="cpp">C++</option>
                                <option value="csharp">C#</option>
                                <option value="php">PHP</option>
                                <option value="ruby">Ruby</option>
                                <option value="go">Go</option>
                                <option value="rust">Rust</option>
                                <option value="swift">Swift</option>
                                <option value="kotlin">Kotlin</option>
                                <option value="html">HTML</option>
                                <option value="css">CSS</option>
                                <option value="scss">SCSS</option>
                                <option value="json">JSON</option>
                                <option value="xml">XML</option>
                                <option value="yaml">YAML</option>
                                <option value="markdown">Markdown</option>
                                <option value="sql">SQL</option>
                                <option value="bash">Bash</option>
                                <option value="powershell">PowerShell</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="expiration" class="form-label">Expiration</label>
                            <select id="expiration" name="expiration" class="form-select">
                                <option value="never">Never</option>
                                <option value="10m">10 Minutes</option>
                                <option value="1h">1 Hour</option>
                                <option value="1d">1 Day</option>
                                <option value="1w">1 Week</option>
                                <option value="1M">1 Month</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="submitText">Create Paste</span>
                            <span id="submitSpinner" class="spinner hidden" style="display: none;"></span>
                        </button>
                        <button type="button" class="btn btn-secondary" id="clearBtn">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>


    <section class="section hidden" id="myPastesSection">
        <div class="container">
            <h2 style="margin-bottom: 1.5rem;">My Pastes</h2>
            <div id="pastesList" class="paste-list">

            </div>

        </div>
    </section>


    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Pastebin Lite</p>
        </div>
    </footer>


    <script>

        if (!localStorage.getItem('token')) {
            window.location.href = '/register';
        }

        const pasteForm = document.getElementById('pasteForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');
        const submitSpinner = document.getElementById('submitSpinner');
        const clearBtn = document.getElementById('clearBtn');
        const myPastesSection = document.getElementById('myPastesSection');
        const pastesList = document.getElementById('pastesList');
        const noPastesMsg = document.getElementById('noPastesMsg');
        const navLinks = document.querySelector('.nav-links');


        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        if (user && token) {

            navLinks.innerHTML = `
                <li class="user-menu">
                    <button class="user-btn">
                        <span>${user.username}</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" id="logoutBtn">Logout</a>
                    </div>
                </li>
            `;


            document.getElementById('logoutBtn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.reload();
            });


            fetchUserPastes();
        } else {

            navLinks.innerHTML = `
                <li><a href="/login" class="nav-link">Login</a></li>
                <li><a href="/register" class="btn btn-primary" style="padding: 0.5rem 1rem;">Register</a></li>
            `;
        }

        async function fetchUserPastes() {
            try {
                const response = await fetch('/api/pastes/my', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const result = await response.json();
                    const pastes = result.data;

                    if (pastes && pastes.length > 0) {
                        myPastesSection.classList.remove('hidden');
                        renderPastes(pastes);
                    } else {
                        myPastesSection.classList.remove('hidden');
                        pastesList.innerHTML = '<p style="color:var(--color-text-secondary)">You haven\'t created any pastes yet.</p>';
                    }
                }
            } catch (error) {
                console.error('Failed to fetch pastes', error);
            }
        }

        function renderPastes(pastes) {
            pastesList.innerHTML = pastes.map(paste => `
                <a href="/p/${paste.id}" class="paste-item">
                    <div class="paste-info">
                        <h3>${paste.title || 'Untitled'}</h3>
                        <div class="paste-meta">
                            <span class="paste-lang">${paste.language}</span>

                        </div>
                    </div>
                    <div class="paste-views">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <span>${paste.view_count}</span>
                    </div>
                </a>
            `).join('');
        }


        pasteForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                title: document.getElementById('title').value.trim() || undefined,
                content: document.getElementById('content').value,
                language: document.getElementById('language').value,
                expiration: document.getElementById('expiration').value
            };


            if (!formData.content.trim()) {
                showToast('Please enter some content', 'error');
                return;
            }


            submitBtn.disabled = true;
            submitText.style.display = 'none';
            submitSpinner.style.display = 'block';

            try {
                const headers = {
                    'Content-Type': 'application/json',
                };

                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/pastes', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showToast('Paste created successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = `/p/${data.data.id}`;
                    }, 500);
                } else {
                    throw new Error(data.message || 'Failed to create paste');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast(error.message || 'Failed to create paste. Please try again.', 'error');


                submitBtn.disabled = false;
                submitText.style.display = 'inline';
                submitSpinner.style.display = 'none';
            }
        });


        clearBtn.addEventListener('click', () => {
            if (confirm('Clear the form?')) {
                pasteForm.reset();
            }
        });


        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            toast.className = `toast ${type}`;
            let icon = '';
            if (type === 'success') {
                icon = '<svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            } else {
                icon = '<svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
            }

            toast.innerHTML = `${icon}<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideUp 0.3s ease reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }


        const contentTextarea = document.getElementById('content');
        contentTextarea.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.max(300, this.scrollHeight) + 'px';
        });
    </script>
</body>

</html>
